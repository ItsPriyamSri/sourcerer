<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120E" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sourcerer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#17150F" />
    <title>Sourcerer — Know what it's worth. Anywhere.</title>
    <meta
      name="description"
      content="Photo → on-device open-weight AI prices the item → BUY / MAYBE / PASS with a max offer. Works in a basement with no bars."
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem("sourcerer.theme");
          var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
